plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.yeab.esnapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.yeab.esnapp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true // 'false' olan bu değeri 'true' yapın
            shrinkResources true // Kullanılmayan kaynakları da kaldırır
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // --- Uygulama bağımlılıkları ---
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.1"
    implementation "androidx.activity:activity-ktx:1.8.2"

    implementation "com.google.android.gms:play-services-auth:20.7.0"

    implementation platform("com.google.firebase:firebase-bom:33.4.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-database"
    implementation "com.google.firebase:firebase-storage"
    implementation "com.google.firebase:firebase-messaging"
    implementation "org.opencv:opencv:4.9.0"
    implementation "com.google.mlkit:text-recognition:16.0.0"
    implementation libs.firebase.crashlytics


    // fused location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // firebase dependencies zaten projende varsa bunlar olabilir:
    implementation 'com.google.firebase:firebase-database-ktx:20.2.0'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.1.2'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    implementation "com.google.firebase:firebase-config-ktx:21.0.2"
    implementation "com.google.android.play:core-ktx:1.8.1"
    implementation "com.google.firebase:firebase-analytics-ktx:21.2.0"




    // --- Test bağımlılıkları (bunlar eksikti) ---
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation 'id.zelory:compressor:3.0.1'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"
    implementation "com.google.mlkit:text-recognition:16.0.0"

}
